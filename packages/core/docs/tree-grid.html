<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>树形结构 - Grid Table</title>
    <link rel="stylesheet" href="../src/style/index.css" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .grid-container {
        height: 400px;
        border: 1px solid #e8e8e8;
      }
      .code-block {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 4px;
        margin: 10px 0 30px;
        font-family: monospace;
        white-space: pre-wrap;
        overflow-x: auto;
      }
      .nav-links {
        margin-bottom: 30px;
      }
      .nav-links a {
        display: inline-block;
        padding: 8px 16px;
        margin-right: 10px;
        background: #f5f5f5;
        border-radius: 4px;
        color: #333;
        text-decoration: none;
        transition: all 0.3s;
      }
      .nav-links a:hover {
        background: #e0e0e0;
      }
      .docs-section {
        margin-bottom: 40px;
      }
      .docs-section h3 {
        border-bottom: 1px solid #eaeaea;
        padding-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>树形结构</h1>

      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="basic.html">基础功能</a>
        <a href="advanced.html">高级功能</a>
        <a href="tree-grid.html">树形结构</a>
        <a href="cell-merge.html">单元格合并</a>
        <a href="complex-components.html">复杂组件</a>
        <a href="custom-components.html">自定义组件</a>
      </div>

      <div class="docs-section">
        <h2>基础树形结构</h2>
        <p>Grid Table 支持树形数据的展示，包括展开/折叠功能和多层级嵌套。</p>

        <div id="treeGrid" class="grid-container"></div>
      </div>
    </div>

    <script type="module">
      import { Grid } from "../src/grid.ts";

      // 树形结构数据
      function getTreeData() {
        return [
          {
            id: "1",
            name: "电子产品",
            expanded: true,
            children: [
              {
                id: "1-1",
                name: "手机",
                expanded: true,
                children: [
                  { id: "1-1-1", name: "iPhone 14", price: 5999, stock: 120 },
                  { id: "1-1-2", name: "Samsung S23", price: 6299, stock: 85 },
                  { id: "1-1-3", name: "Huawei P50", price: 4999, stock: 60 },
                ],
              },
              {
                id: "1-2",
                name: "电脑",
                expanded: false,
                children: [
                  { id: "1-2-1", name: "MacBook Pro", price: 13999, stock: 45 },
                  { id: "1-2-2", name: "Dell XPS", price: 9999, stock: 30 },
                  { id: "1-2-3", name: "ThinkPad X1", price: 11999, stock: 25 },
                ],
              },
            ],
          },
          {
            id: "2",
            name: "家用电器",
            expanded: false,
            children: [
              {
                id: "2-1",
                name: "厨房电器",
                children: [
                  { id: "2-1-1", name: "微波炉", price: 899, stock: 150 },
                  { id: "2-1-2", name: "电饭煲", price: 499, stock: 200 },
                ],
              },
            ],
          },
        ];
      }

      // 基础树形表格
      const treeGrid = new Grid({
        columns: [
          {
            field: "name",
            headerName: "产品分类",
            width: 300,
            cellRenderer: "treeCell",
            treeColumn: true,
          },
          {
            field: "price",
            headerName: "价格",
            editable: true,
            width: 150,
            valueFormatter: (params) => {
              return params.value ? `¥${params.value.toLocaleString()}` : "";
            },
          },
          { field: "stock", headerName: "库存", width: 120, editable: true },
        ],
        rowData: getTreeData(),
        treeData: true,
      });
      treeGrid.render(document.getElementById("treeGrid"));
    </script>
  </body>
</html>
