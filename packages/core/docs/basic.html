<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基础功能 - Grid Table</title>
    <link rel="stylesheet" href="../src/style/index.css" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .grid-container {
        height: 400px;
        border: 1px solid #e8e8e8;
      }
      .code-block {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 4px;
        margin: 10px 0 30px;
        font-family: monospace;
        white-space: pre-wrap;
        overflow-x: auto;
      }
      .nav-links {
        margin-bottom: 30px;
      }
      .nav-links a {
        display: inline-block;
        padding: 8px 16px;
        margin-right: 10px;
        background: #f5f5f5;
        border-radius: 4px;
        color: #333;
        text-decoration: none;
        transition: all 0.3s;
      }
      .nav-links a:hover {
        background: #e0e0e0;
      }
      .docs-section {
        margin-bottom: 40px;
      }
      .docs-section h3 {
        border-bottom: 1px solid #eaeaea;
        padding-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>基础功能</h1>

      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="basic.html">基础功能</a>
        <a href="advanced.html">高级功能</a>
        <a href="tree-grid.html">树形结构</a>
        <a href="cell-merge.html">单元格合并</a>
        <a href="complex-components.html">复杂组件</a>
        <a href="custom-components.html">自定义组件</a>
      </div>

      <div class="docs-section">
        <h2>基础表格</h2>
        <p>
          展示基础表格的配置和使用方法，包括列定义、数据绑定、排序等基础功能。
        </p>

        <div id="basicGrid" class="grid-container"></div>
      </div>

      <div class="docs-section">
        <h2>列排序</h2>
        <p>
          Grid Table 支持单列和多列排序。点击列头可以按照该列排序，按住 Shift
          键点击可以添加次要排序列。
        </p>

        <h3>排序配置选项</h3>
        <ul>
          <li><code>sortable</code>: 设置列是否可排序</li>
          <li><code>sortComparator</code>: 自定义排序比较函数</li>
          <li><code>initialSort</code>: 设置初始排序状态</li>
        </ul>
      </div>

      <div class="docs-section">
        <h2>冻结列</h2>
        <p>Grid Table 支持冻结左侧或右侧的列，在横向滚动时保持可见。</p>

        <div id="pinnedColumnsGrid" class="grid-container"></div>
      </div>
    </div>

    <script type="module">
      import { Grid } from "../src/grid.ts";

      // 基础示例数据
      function getData() {
        return Array.from({ length: 100 }, (_, i) => ({
          id: `ID${i + 1}`,
          name: `Name ${i + 1}`,
          age: Math.floor(Math.random() * 50) + 20,
          city: ["北京", "上海", "广州", "深圳"][Math.floor(Math.random() * 4)],
        }));
      }

      // 基础表格
      const basicGrid = new Grid({
        columns: [
          {
            field: "drag",
            headerName: "拖拽",
            width: 60,
            rowDrag: true,
          },
          {
            field: "id",
            headerName: "ID",
            width: 100,
            sortable: true,
          },
          { field: "name", headerName: "姓名", width: 150, sortable: true },
          { field: "age", headerName: "年龄", width: 100, sortable: true },
          { field: "city", headerName: "城市", width: 120, sortable: true },
        ],
        rowData: getData(),
      });
      basicGrid.render(document.getElementById("basicGrid"));
      // 冻结列示例
      const pinnedColumnsGrid = new Grid({
        columns: [
          { field: "id", headerName: "ID", width: 100, pinned: "left" },
          { field: "name", headerName: "姓名", width: 150 },
          { field: "age", headerName: "年龄", width: 100 },
          { field: "city", headerName: "城市", width: 120 },
          {
            field: "operations",
            headerName: "操作",
            width: 120,
            pinned: "right",
            cellRenderer: () => {
              const btn = document.createElement("button");
              btn.innerText = "查看";
              btn.style.padding = "2px 8px";
              return btn;
            },
          },
        ],
        rowData: getData(),
      });
      pinnedColumnsGrid.render(document.getElementById("pinnedColumnsGrid"));
    </script>
  </body>
</html>
